services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      # File events from a Windows bind mount don't reach the container reliably,
      # so Next.js (Turbopack) polls for changes. See next.config.ts.
      - WATCH_POLL_MS=1000
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
    volumes:
      # Your source code, live-synced into the container.
      - .:/app
      # Keep Linux dependencies and build cache inside Docker, not overwritten
      # by the Windows node_modules / .next on the host.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
